name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-card:
    name: Attach the card to the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i -E "s/^const WL_VERSION = \".*\";/const WL_VERSION = \"${VERSION}\";/" watchlist-card.js
          grep -m1 'WL_VERSION' watchlist-card.js

      - name: Upload the asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" watchlist-card.js --clobber
